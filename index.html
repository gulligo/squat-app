<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>용용이 스쿼트</title>

<style>
:root{
  --bg:#f7f1fb;
  --card:#ffffff;
  --line:#eadcf6;
  --primary:#8d4dff;
  --primary2:#c48bff;
  --text:#333;
  --orange:#ff8a2a;
  --green:#19c37d;
  --soft-pink:#f3d1da;
  --soft-pink-2:#efc4d0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x: hidden;
}
.top-tabs{
  position:sticky;
  top:0;
  z-index:50;
  display:flex;
  background:#fff;
  border-bottom: none;
}
.top-tabs button{
  flex:1;
  border:none;
  background:none;
  padding:10px 15px;
  font-size:15px;
  font-weight:800;
  color:#666;
}
.top-tabs button.active{
  color:var(--primary);
}
.page{display:none;padding:4px 8px 220px}
.page.active{display:block}
.calendar-page .calendar-header button {
    font-size: 35px !important;
    font-weight: bold;
    padding: 10px 25px !important;
    color: #8d4dff !important;
    border: none;
    background: none;
}
.card{
  background:var(--card);
  border-radius:16px;
  padding:4px 8px;
  margin-bottom:2px;
}
.goal-head{font-size:12px;color:#999;margin-bottom:2px}
.goal-line{display:flex;align-items:center;gap:8px;margin-bottom:1px}
.goal-num{font-size:16px;font-weight:900}
.goal-input{
  width:82px;height:32px;border-radius:12px;border:2px solid var(--line);
  text-align:center;font-size:15px;font-weight:800;color:#444;background:#faf7ff;
}
.bar{height:6px;background:transparent;overflow:hidden}
.bar>div{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#8b5cf6,#ec4899);
  transition:width .2s;
}
.monthbar>div{background:linear-gradient(90deg,#22c55e,#4ade80)}
.hero{text-align:center;padding:6px 8px;margin-top:4px}
.hero-count{font-size:120px;line-height:1;color:var(--primary);font-weight:900}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.mini-title{font-size:11px;color:#9f90ab;margin-bottom:5px}
.mini-value{font-size:24px;font-weight:900;line-height:1.1}
.center{text-align:center}
.card.center{min-height:70px;display:flex;flex-direction:column;justify-content:center}
.orange{color:var(--orange)}
.green{color:var(--green)}
.purple{color:var(--primary)}
.small{font-size:11px;color:#b7aabc}
.streak{display:grid;grid-template-columns:1fr 1px 1fr;gap:8px;align-items:center}
.divider{width:1px;background:#eee}
.main-btn-row{display:flex;justify-content:center;gap:10px;margin-top:2px}
.main-btn{
  border:none;background:linear-gradient(90deg,var(--primary),var(--primary2));
  color:#fff;font-size:21px;font-weight:900;padding:14px 26px;border-radius:999px;
  box-shadow:0 8px 20px rgba(141,77,255,.22);
}
.main-btn.plus10{background:linear-gradient(90deg,#6f63ff,#b77dff)}
.settings-list .row{
  display:flex;justify-content:space-between;align-items:center;
  padding:11px 0;border-bottom:none;
}
.settings-list .row:last-child{border-bottom:none}
.toggle{
  width:54px;height:32px;border-radius:999px;background:#ddd;position:relative;border:none;
}
.toggle::after{
  content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:.2s;
}
.toggle.on{background:var(--primary)}
.toggle.on::after{left:26px}
.voice-row,.graph-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{
  border:none;padding:8px 11px;border-radius:999px;background:#f1ebf8;color:#666;font-weight:800;
}
.chip.active{background:var(--primary);color:#fff}
.section-title{font-size:16px;font-weight:900;margin:0 0 8px}
.cal-heads,.calendar-grid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:12px 4px;
}
.cal-head{text-align:center;font-size:25px;color:#7b6888;font-weight:800}
.day{
  min-height:80px;border-radius:10px;background:#fcfbfe;padding:3px 1px 4px;text-align:center;
}
.day.empty{background:transparent}
.day-bubble-wrap{
  height:50px;display:flex;align-items:center;justify-content:center;
}
.day-bubble{
  border-radius:50%;
  background:linear-gradient(180deg,var(--soft-pink),var(--soft-pink-2));
  display:flex;align-items:center;justify-content:center;
  color:#5f4d69;font-weight:900;font-size:11px;
}
.day-count{margin-top:2px;font-size:18px;font-weight:900;color:#7a9adb;min-height:12px}
.chartWrap {
  display: flex;
  align-items: flex-end;
  gap: 1px;
  height: 500px;
  overflow-x: auto;
  overflow-y: hidden;
  min-width: 0;
  padding-top: 20px;
  background-image: linear-gradient(#eee 1px, transparent 1px);
  background-size: 100% 55px;
}
.barItem { flex: 1; text-align: center; padding: 0 1px; }
.barVal { font-size: 8px; color: #555; margin-bottom: 2px; }
.barCol { width: 100%; background: #7c4dff; border-radius: 2px 2px 0 0; min-height: 1px; }
.barLbl { font-size: 8px; color: #555; margin-top: 3px; }
.floating{
  position:fixed;right:12px;bottom:16px;z-index:99;
  width:150px;height:150px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 8px 24px rgba(0,0,0,.18);overflow:hidden;
}
.floating img{width:100%;height:100%;object-fit:cover}
.notice{
  position:fixed;left:50%;bottom:165px;transform:translateX(-50%);
  background:rgba(34,34,34,.92);color:#fff;padding:10px 14px;border-radius:999px;
  font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:100;
  max-width:88vw;white-space:nowrap;
}
.notice.show{opacity:1}
  .confetti-container{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;z-index:999;overflow:hidden;
}
.confetti{
  position:absolute;top:-10px;
  width:10px;height:14px;
  opacity:0;
  animation:confetti-fall 2.5s ease-in forwards;
}
@keyframes confetti-fall{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  100%{transform:translateY(100vh) rotate(720deg);opacity:0}
}
</style>
</head>
<body>

</div>
<div id="calendar" class="page">

<div id="graph" class="page">

function ymd(d=new Date()){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function getCount(day){ return data.records[day] || 0; }

function setCount(day,count){
  data.records[day] = Math.max(0,count);
  if(data.records[day]===0) delete data.records[day];
}

function loadData(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return clone(defaultData);
    const parsed = JSON.parse(raw);
    return {
      ...clone(defaultData),
      ...parsed,
      records:{...defaultData.records,...(parsed.records||{})},
      settings:{...defaultData.settings,...(parsed.settings||{})}
    };
  }catch(e){
    return clone(defaultData);
  }
}

function saveData(){
  localStorage.setItem(KEY, JSON.stringify(data));
}

function randomFrom(arr){
  if(!arr || arr.length===0) return '';
  return arr[Math.floor(Math.random()*arr.length)];
}

function getEventLine(){
  if(data.settings.voice==='male') return randomFrom(MALE_LINES);
  if(data.settings.voice==='baby') return randomFrom(FEMALE_LINES);
  return randomFrom(FEMALE_LINES);
}

function getEventLine(){
  if(data.settings.voice==='male') return randomFrom(MALE_LINES);
  if(data.settings.voice==='baby') return randomFrom(MALE_LINES);
  return randomFrom(FEMALE_LINES);
}

function speak(text){
  if(data.settings.voice==='mute') return;
  try{
    speechSynthesis.cancel();
    const msg = new SpeechSynthesisUtterance(text);
    msg.lang = 'ko-KR';
    if(data.settings.voice==='male'){
  msg.pitch = 0.82;
  msg.rate = 0.78;
}else{
      msg.pitch = 1.05;
      msg.rate = 0.80;
    }
    const voices = speechSynthesis.getVoices();
    const ko = voices.find(v=>v.lang && v.lang.toLowerCase().includes('ko'));
    if(ko) msg.voice = ko;
    speechSynthesis.speak(msg);
  }catch(e){}
}
function launchConfetti(){
  const container = document.createElement('div');
  container.className = 'confetti-container';
  document.body.appendChild(container);
  const colors = ['#8d4dff','#ff8a2a','#19c37d','#f43f5e','#facc15','#38bdf8'];
  for(let i=0;i<80;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random()*100 + '%';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    c.style.width = (Math.random()*8+6) + 'px';
    c.style.height = (Math.random()*10+8) + 'px';
    c.style.animationDelay = Math.random()*1.2 + 's';
    c.style.animationDuration = (Math.random()*1.5+2) + 's';
    c.style.borderRadius = Math.random()>0.5 ? '50%' : '0';
    container.appendChild(c);
  }
  setTimeout(()=>container.remove(), 4000);
}
function showNotice(text){
  notice.textContent = text;
  notice.classList.add('show');
  clearTimeout(showNotice.t);
  showNotice.t = setTimeout(()=>notice.classList.remove('show'),1600);
}

function addSquat(amount=1){
  if (isPaused) return;
  const day = ymd();
  const before = getCount(day);
  setCount(day, before + amount);
  if(data.settings.vibrate && navigator.vibrate){
    navigator.vibrate(amount===10 ? [25,40,25] : 25);
  }
  const after = getCount(day);
  if(data.settings.sound && data.settings.voice!=='mute'){
    if(after % EVENT_STEP !== 0){
      speak(String(after));
    }
  }
  if(data.settings.cheer){
    const beforeStep = Math.floor(before / EVENT_STEP);
    const afterStep = Math.floor(after / EVENT_STEP);
    if(afterStep > beforeStep){
      const line = getEventLine();
      if(line){
        showNotice(line);
        if(data.settings.cheer && data.settings.voice!=='mute') speak(line);
      }
    }
  }
  const prevPct = Math.floor(before / data.todayGoal * 100);
  const newPct = Math.floor(after / data.todayGoal * 100);
  if(prevPct < 100 && newPct >= 100) launchConfetti();
  saveData();
  render();
}

function monthDays(base=new Date()){
  const y = base.getFullYear();
  const m = base.getMonth();
  const last = new Date(y,m+1,0).getDate();
  const arr = [];
  for(let i=1;i<=last;i++) arr.push(new Date(y,m,i));
  return arr;
}

function monthTotal(date=new Date()){
  const y = date.getFullYear();
  const m = date.getMonth()+1;
  let sum = 0;
  for(const k in data.records){
    if(k.startsWith(`${y}-${String(m).padStart(2,'0')}-`)) sum += data.records[k];
  }
  return sum;
}

function yearTotal(date=new Date()){
  const y = `${date.getFullYear()}-`;
  let sum = 0;
  for(const k in data.records){
    if(k.startsWith(y)) sum += data.records[k];
  }
  return sum;
}

function allTotal(){
  return Object.values(data.records).reduce((a,b)=>a+b,0);
}

function dayMax(){
  let max = 0;
  for(const k in data.records){
    if(data.records[k] > max) max = data.records[k];
  }
  return max;
}

function calcStreaks(){
  const keys = Object.keys(data.records).filter(k=>data.records[k]>0).sort();
  if(keys.length===0) return {current:0,best:0};
  let best = 1;
  let cur = 1;
  for(let i=1;i<keys.length;i++){
    const prev = new Date(keys[i-1]);
    const curr = new Date(keys[i]);
    const diff = (curr-prev)/86400000;
    if(diff===1){
      cur++;
      best=Math.max(best,cur);
    }else{
      cur=1;
    }
  }
  let current = 0;
  const today = new Date(ymd());
  for(let i=0;;i++){
    const d = new Date(today);
    d.setDate(today.getDate()-i);
    if(getCount(ymd(d))>0) current++;
    else break;
  }
  return {current,best};
}

function weekTotal(){
  const today = new Date();
  let sum = 0;
  for(let i=0;i<7;i++){
    const d = new Date(today);
    d.setDate(today.getDate()-i);
    sum += getCount(ymd(d));
  }
  return sum;
}

function bubbleSize(count,max){
  if(count<=0) return 0;
  const minSize = 14;
  const maxSize = 46;
  const ratio = count / 1000;
  return Math.round(minSize + (maxSize-minSize)*ratio);
}
  let calendarViewDate = new Date();
let graphViewDate = new Date();
function changeGraphMonth(diff){
  if(!graphViewDate) graphViewDate = new Date();
  if(data.graphMode === 'day'){
    graphViewDate.setMonth(graphViewDate.getMonth() + diff);
  } else {
    graphViewDate.setFullYear(graphViewDate.getFullYear() + diff);
  }
  renderChart();
}
function changeMonth(dir){
  calendarViewDate.setMonth(calendarViewDate.getMonth() + dir);
  renderCalendar();
  const title = document.getElementById('calendar-title');
  if(title) title.textContent = `${calendarViewDate.getFullYear()}년 ${calendarViewDate.getMonth()+1}월`;
}

function updateFloatingVisibility(){
  if(!floatBtn) return;
  floatBtn.style.display = (currentPage === 'home') ? 'block' : 'none';
}

function setToggle(id, on){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.toggle('on', on);
}

function backupData(){
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'squat_backup.json';
  a.click();
}

function restoreData(){
  document.getElementById('restoreFile').click();
}

document.getElementById('restoreFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      Object.assign(data, parsed);
      saveData();
      render();
      showNotice('복구 완료!');
    }catch(err){
      showNotice('복구 실패: 파일 오류');
    }
  };
  reader.readAsText(file);
});

function renderCalendar(){
  const heads = document.getElementById('calendarHeads');
  const grid = document.getElementById('calendarGrid');
  heads.innerHTML = '';
  grid.innerHTML = '';

  const y = calendarViewDate.getFullYear();
  const m = calendarViewDate.getMonth();
  const days = monthDays(calendarViewDate);
  const firstDay = new Date(y, m, 1).getDay();

  const title = document.getElementById('calendar-title');
  if(title) title.textContent = `${y}년 ${m+1}월`;
  const calAvg = document.getElementById('calAvg');
  const calSum = document.getElementById('calSum');
  const mPrefix = `${y}-${String(m+1).padStart(2,'0')}-`;
  const mVals = Object.keys(data.records).filter(k=>k.startsWith(mPrefix)).map(k=>data.records[k]);
  const mSum = mVals.reduce((a,b)=>a+b,0);
  const today3 = new Date(); today3.setHours(0,0,0,0);
const mLastDay = new Date(Math.min(today3.getTime(), new Date(y,m+1,0).getTime()));
const mFirstKey = Object.keys(data.records).filter(k=>k.startsWith(mPrefix)).sort()[0];
const mFirstDay = mFirstKey ? new Date(mFirstKey) : new Date(y,m,1);
  mFirstDay.setHours(0,0,0,0);
const mDays2 = Math.floor((mLastDay - mFirstDay)/86400000) + 1;
const mAvg = mDays2 > 0 ? Math.round(mSum/mDays2) : 0;
  if(calAvg) calAvg.textContent = mAvg;
  if(calSum) calSum.textContent = mSum.toLocaleString();
  const prevBtn = document.querySelector('button[onclick="changeMonth(-1)"]');
  const nextBtn = document.querySelector('button[onclick="changeMonth(1)"]');
  if(prevBtn) prevBtn.style.fontSize = '50px';
  if(nextBtn) nextBtn.style.fontSize = '50px';

  ['일','월','화','수','목','금','토'].forEach(name=>{
    const h = document.createElement('div');
    h.className = 'cal-head';
    h.textContent = name;
    heads.appendChild(h);
  });

  const counts = days.map(d=>getCount(ymd(d)));
  const maxCount = Math.max(1,...counts);
  const todayKey = ymd();
  const maxVal = Math.max(...counts);
  const maxIdx = counts.indexOf(maxVal);
  const maxKey = maxVal > 0 ? ymd(days[maxIdx]) : null;

  for(let i=0;i<firstDay;i++){
    const empty = document.createElement('div');
    empty.className = 'day empty';
    grid.appendChild(empty);
  }

  days.forEach(d=>{
    const key = ymd(d);
    const count = getCount(key);
    const el = document.createElement('div');
    el.className = 'day';

    const wrap = document.createElement('div');
    wrap.className = 'day-bubble-wrap';

    const bubble = document.createElement('div');
    bubble.className = 'day-bubble';
    bubble.style.width = (count>0 ? bubbleSize(count,maxCount) : 0) + 'px';
    bubble.style.height = (count>0 ? bubbleSize(count,maxCount) : 0) + 'px';
    bubble.textContent = d.getDate();
    bubble.style.fontSize = '22px';
    bubble.style.fontWeight = 'bold';
    if(key===todayKey){
      bubble.style.outline = '2px solid #8d4dff';
      bubble.style.outlineOffset = '1px';
    }
    if(key===maxKey && maxVal>0){
      bubble.style.border = '3px solid #ff8a2a';
      bubble.style.boxSizing = 'border-box';
    }
    if(count===0){
      bubble.style.background = '#f7f3fa';
      bubble.style.color = '#b6a8c4';
    }

    wrap.appendChild(bubble);

    const cnt = document.createElement('div');
    cnt.className = 'day-count';
    cnt.textContent = count>0 ? String(count) : '';
    cnt.style.fontSize = '11px';
    cnt.style.fontWeight = 'bold';
    cnt.style.marginTop = '0px';
    cnt.style.color = '#db96ac';

    el.appendChild(wrap);
    el.appendChild(cnt);
    grid.appendChild(el);
  });
}
function getMonthlySeries(){
  const arr = [];
  const today = new Date();
  const y = graphViewDate.getFullYear();
  for(let m=1;m<=12;m++){
    let sum = 0;
    for(const k in data.records){
      if(k.startsWith(`${y}-${String(m).padStart(2,'0')}-`)) sum += data.records[k];
    }
    arr.push({label:`${m}월`, value:sum});
  }
  return arr;
}
function getYearlySeries(){
  const arr = [];
  const today = new Date();
  for(let i=2;i>=0;i--){
    const y = today.getFullYear()-i;
    let sum = 0;
    for(const k in data.records){
      if(k.startsWith(String(y))) sum += data.records[k];
    }
    arr.push({label:`${y}`, value:sum});
  }
  return arr;
}

function getDailySeries(){
  const arr = [];
  const y = graphViewDate.getFullYear();
  const m = graphViewDate.getMonth();
  const lastDay = new Date(y, m+1, 0).getDate();
  for(let i=1;i<=lastDay;i++){
    const d = new Date(y, m, i);
    const k = ymd(d);
    const val = (data.records && data.records[k]) || 0;
    arr.push({label:i, value:val});
  }
  return arr;
}

function renderChart(){
  const wrap = document.getElementById('chartWrap');
  if(!wrap) return;
  wrap.innerHTML = '';
  const graphMonthLabel = document.getElementById('graphMonthLabel');
if(graphMonthLabel){
  if(data.graphMode === 'month'){
  graphMonthLabel.textContent = `${graphViewDate.getFullYear()}년`;
}else if(data.graphMode === 'year'){
  graphMonthLabel.textContent = `연도별`;
}else{
  graphMonthLabel.textContent = `${graphViewDate.getFullYear()}년 ${graphViewDate.getMonth()+1}월`;
}
}
  const graphTitle = document.querySelector('#graph .section-title');
  if(graphTitle){
    graphTitle.style.display = 'none';
    graphTitle.parentElement.style.paddingTop = '0px';
  }
  document.querySelectorAll('.graph-chip').forEach(ch=>{
    ch.classList.toggle('active', ch.dataset.graph===data.graphMode);
  });
  let arr = [];
  if(!data.graphMode) data.graphMode = 'day';
  if(data.graphMode === 'month') arr = getMonthlySeries();
  else if(data.graphMode === 'year') arr = getYearlySeries();
  else arr = getDailySeries();
  const graphAvg = document.getElementById('graphAvg');
const graphSum = document.getElementById('graphSum');
const sumVal = arr.reduce((a,b)=>a+b.value,0);
const avgVal = arr.filter(x=>x.value>0).length > 0 ? Math.round(sumVal/arr.filter(x=>x.value>0).length) : 0;
if(graphAvg) graphAvg.textContent = avgVal;
if(graphSum) graphSum.textContent = sumVal.toLocaleString();
  let max = 1200;

if(data.graphMode === 'month'){
  max = 13000;
} else if(data.graphMode === 'year'){
  max = 130000;
} else {
  max = Math.max(1, ...arr.map(x => x.value));
}

const yTop = document.getElementById('yTop');
const yMid = document.getElementById('yMid');
const yBottom = document.getElementById('yBottom');

if(yTop) yTop.textContent = max;
if(yMid) yMid.textContent = Math.round(max / 2);
if(yBottom) yBottom.textContent = 0;
  arr.forEach(item=>{
  const h = Math.max(12, Math.round((item.value/max)*460));
  const div = document.createElement('div');
  div.className = 'barItem';
  div.innerHTML = `<div class="barVal">${item.value}</div><div class="barCol" style="height:${h}px"></div><div class="barLbl">${item.label}</div>`;
  wrap.appendChild(div);
});

}
function render(){
  const today = getCount(ymd());
  const mTotal = monthTotal();
  const yTotal = yearTotal();
  const total = allTotal();
  const streak = calcStreaks();

  document.getElementById('todayGoalNow').textContent = today;
  document.getElementById('monthGoalNow').textContent = mTotal;
  document.getElementById('heroCount').textContent = today;
  document.getElementById('currentStreak').textContent = streak.current;
  document.getElementById('bestStreak').textContent = streak.best;

  const today2 = new Date(); today2.setHours(0,0,0,0);
  const thisY = today2.getFullYear();
  const thisM = today2.getMonth();
  const allKeys = Object.keys(data.records).sort();
  const mPrefix = `${thisY}-${String(thisM+1).padStart(2,'0')}-`;
  const mKeys = allKeys.filter(k=>k.startsWith(mPrefix));
  const mFirst = mKeys.length ? new Date(mKeys[0]) : new Date(thisY,thisM,1);
  mFirst.setHours(0,0,0,0);
  const mLast = new Date(Math.min(today2.getTime(), new Date(thisY,thisM+1,0).getTime()));
  const mDays = Math.floor((mLast-mFirst)/86400000)+1;
  const yKeys = allKeys.filter(k=>k.startsWith(`${thisY}-`));
  const yFirst = yKeys.length ? new Date(yKeys[0]) : new Date(thisY,0,1);
  yFirst.setHours(0,0,0,0);
  const yDays = Math.floor((today2-yFirst)/86400000)+1;
  const aFirst = allKeys.length ? new Date(allKeys[0]) : today2;
  aFirst.setHours(0,0,0,0);
  const aDays = Math.floor((today2-aFirst)/86400000)+1;
  document.getElementById('monthAvg').textContent = Math.round(mTotal/Math.max(1,mDays));
  document.getElementById('yearAvg').textContent = Math.round(yTotal/Math.max(1,yDays));
  document.getElementById('allAvg').textContent = Math.round(total/Math.max(1,aDays));
  document.getElementById('dayMax').textContent = dayMax().toLocaleString();
  document.getElementById('monthTotal').textContent = mTotal.toLocaleString();
  document.getElementById('allTotal').textContent = total.toLocaleString();

  document.getElementById('statsToday').textContent = today.toLocaleString();
  document.getElementById('weekTotal').textContent = weekTotal().toLocaleString();
  document.getElementById('statsMonth').textContent = mTotal.toLocaleString();
  document.getElementById('statsAllTotal').textContent = total.toLocaleString();

  const todayPct = Math.round((today / Math.max(1, data.todayGoal)) * 100);
  const monthPct = Math.round((mTotal / Math.max(1, data.monthGoal)) * 100);
  document.getElementById('todayBar').style.width = todayPct + '%';
  document.getElementById('monthBar').style.width = monthPct + '%';
  document.getElementById('todayPercent').textContent = todayPct + '%';
  document.getElementById('monthPercent').textContent = monthPct + '%';

  setToggle('togAuto',data.settings.autoCount);
  setToggle('togSound',data.settings.sound);
  setToggle('togCheer',data.settings.cheer);
  setToggle('togVibrate',data.settings.vibrate);

  document.querySelectorAll('.voice-chip').forEach(chip=>{
    chip.classList.toggle('active', chip.dataset.voice===data.settings.voice);
  });
}
 window.addEventListener('devicemotion', function(e){
  if(!data.settings.autoCount) return;
  if(isPaused) return;
  if(document.hidden) return;
  if(currentPage!=='home') return;
  const acc = e.accelerationIncludingGravity;
  if(!acc) return;
  const x = acc.x || 0;
  const y = acc.y || 0;
  const z = acc.z || 0;
  const mag = Math.sqrt(x*x + y*y + z*z);
  const now = Date.now();
  if(auto.base===null){
    auto.base = mag;
    auto.stage = 'idle';
    auto.lowDelta = 0;
    auto.highDelta = 0;
    return;
  }
  auto.base = auto.base * 0.993 + mag * 0.007;
  const delta = mag - auto.base;
  if(auto.stage==='idle'){
    if(delta < -1.5){ auto.stage = 'down'; auto.downTime = now; auto.lowDelta = delta; }
    return;
  }
  if(auto.stage==='down'){
    if(delta < auto.lowDelta) auto.lowDelta = delta;
    if(now - auto.downTime > 3500){ auto.stage = 'idle'; return; }
    if(delta > 1.2 && now - auto.downTime > 250){ auto.stage = 'up'; auto.upTime = now; auto.highDelta = delta; }
    return;
  }
  if(auto.stage==='up'){
    if(delta > auto.highDelta) auto.highDelta = delta;
    if(now - auto.upTime > 2500){ auto.stage = 'idle'; return; }
    if(delta > -0.3 && delta < 1.0 && now - auto.upTime > 150 && now - auto.lastCountTime > 2500){
      auto.lastCountTime = now;
      auto.stage = 'idle';
      addSquat(1);
    }
  }
});

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ auto.base = null; auto.stage = 'idle'; }
});

(function(){
  const btn = floatBtn;
  btn.style.right = '12px';
  btn.style.bottom = '16px';
  btn.addEventListener('touchstart',e=>{
    if(currentPage!=='home') return;
    isDragging = false;
    const t = e.touches[0];
    dragStartX = t.clientX;
    dragStartY = t.clientY;
    const rect = btn.getBoundingClientRect();
    btnStartX = rect.left;
    btnStartY = rect.top;
  },{passive:true});
  btn.addEventListener('touchmove',e=>{
    if(currentPage!=='home') return;
    const t = e.touches[0];
    const dx = t.clientX - dragStartX;
    const dy = t.clientY - dragStartY;
    if(Math.abs(dx)>8 || Math.abs(dy)>8) isDragging = true;
    if(isDragging){
      e.preventDefault();
      btn.style.left = Math.max(0, Math.min(window.innerWidth-150, btnStartX+dx)) + 'px';
      btn.style.top = Math.max(0, Math.min(window.innerHeight-150, btnStartY+dy)) + 'px';
      btn.style.right = 'auto';
      btn.style.bottom = 'auto';
    }
  },{passive:false});
  btn.addEventListener('touchend',()=>{
    setTimeout(()=>{ isDragging = false; },30);
  });
})();

render();
renderCalendar();
renderChart();
updateFloatingVisibility();
